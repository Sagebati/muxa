# Host app's own config file — muxa's plugin config lives under [muxa],
# grouped and collision-free against this app's own top-level keys.
# Override any muxa value via env, e.g. MUXA_MUXA__WEB__PORT=8080.
#
# Tracing verbosity is controlled via `RUST_LOG` (default: `info`).

[app]
greeting = "hello, muxa (sqlite)"

[muxa.web]
host = "0.0.0.0"
port = 3000

[muxa.otel]
service_name = "hello"

[muxa.sqlite]
# In-memory by default; perfect for the example. Use e.g.
#   url = "sqlite:./hello.db"
# (and `create_if_missing = true`) for a persistent file.
url = "sqlite::memory:"
create_if_missing = true
max_connections = 5
