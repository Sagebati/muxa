[package]
name = "muxa-telemetry"
description = "Telemetry kernel for muxa — owns the global tracing-subscriber and a slot plugins attach their tracing layers to"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tracing            = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "registry", "std"] }

# wasm: events go to the JS console in place of `fmt` (no stdout there).
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys      = { workspace = true, features = ["console"] }

[lints]
workspace = true
