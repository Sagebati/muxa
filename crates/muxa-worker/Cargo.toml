[package]
name = "muxa-worker"
description = "Cloudflare Workers plugin for the muxa framework — mounts routes without a serve loop and dispatches Worker requests through the composed axum router"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# `WorkerEnv::d1` — a D1 database handle from the per-request `Env`.
d1 = ["worker/d1"]

[dependencies]
muxa-core   = { workspace = true }
axum        = { workspace = true }
tower       = { workspace = true }
http        = { workspace = true }
figment     = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true, features = ["registry", "std"] }
worker      = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
